name: Atualizar perfil

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  profile:
    name: Gerar painel do README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gerar painel com métricas atuais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: npm run build

      - name: Validar saída
        run: node scripts/verify-profile.mjs

      - name: Commitar somente quando o painel mudar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/profile.svg
          git diff --staged --quiet || git commit -m "chore: atualiza métricas do perfil [skip ci]"
          git push
